name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # O openapi-generator roda em Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Regenera o cliente a partir do contrato fixado em contract.version. Se o
      # código commitado for diferente, alguém editou o gerado à mão ou mudou a
      # versão do contrato sem regenerar.
      - name: Cliente da API atualizado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tool/generate-api.sh
          if ! git diff --exit-code -- src/app/api; then
            echo "::error::Cliente desatualizado: rode 'bash tool/generate-api.sh' e commite src/app/api"
            exit 1
          fi

      - name: Formatação
        run: npx prettier --check "src/**/*.{ts,html,scss}" "e2e/**/*.ts" playwright.config.ts

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

  # Ponta a ponta: o backoffice de verdade contra a API de verdade, na versão
  # fixada em contract.version, com PostgreSQL e o seed de demonstração.
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Versão da API
        run: echo "API_VERSION=$(tr -d '[:space:]' < contract.version)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          repository: Mavoxweb/wallet-ledger-api
          ref: ${{ env.API_VERSION }}
          path: api

      - name: Sobe a API
        working-directory: api
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: npx playwright test

      - name: Logs da API
        if: failure()
        working-directory: api
        run: docker compose logs api

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
