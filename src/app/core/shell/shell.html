<div class="layout">
  <nav class="nav" aria-label="Menu principal">
    <div class="brand">
      <wl-brand-mark [size]="28" [inverted]="true" />
      <div class="brand-text">
        <span class="brand-name">Wallet Ledger</span>
        <span class="brand-sub">Operação</span>
      </div>
    </div>

    <div class="links">
      <a class="link" routerLink="/contas" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="9" cy="8" r="3.5" />
          <path d="M3 19c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5" />
          <path d="M16 5.5a3 3 0 0 1 0 5.5M18 14.8c1.6.6 2.6 2 3 4.2" />
        </svg>
        Contas
      </a>
      <a
        class="link"
        routerLink="/auditoria"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M7 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 7 20z" />
          <path d="M10 11h6M10 14.5h6M10 18h3.5" />
        </svg>
        Auditoria
      </a>
    </div>

    <div class="spacer"></div>

    <div class="user">
      <div class="user-text">
        <span class="user-name">{{ session.userName() }}</span>
        <span class="user-role">{{ roleLabel() }}</span>
      </div>
      <button class="logout" type="button" (click)="logout()">Sair</button>
    </div>
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
