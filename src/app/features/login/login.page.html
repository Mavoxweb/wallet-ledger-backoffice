<main class="page">
  <div class="column">
    <div class="brand">
      <wl-brand-mark />
      <div class="brand-text">
        <span class="brand-name">Wallet Ledger</span>
        <span class="brand-sub">Backoffice da operação</span>
      </div>
    </div>

    <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Entrar</h1>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input
          matInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </mat-form-field>

      @if (error()) {
        <p class="alert" role="alert">{{ error() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="busy()">
        {{ busy() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="hint">
      Contas de demonstração: <strong>operador&#64;walletledger.dev</strong> e
      <strong>admin&#64;walletledger.dev</strong>, senha Demo&#64;1234.
    </p>
  </div>
</main>
